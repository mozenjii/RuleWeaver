name: release

# Push a tag that matches the version in src/ruleweaver/__init__.py, e.g. v0.2.0.
# Publishes the wheel and sdist as a GitHub Release, and the reviewer application's image
# to ghcr.io/<owner>/ruleweaver. Uses only the repository's own token: no secrets to set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The tag must match the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/ruleweaver/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test before publishing anything
        run: python -m pip install --upgrade pip && pip install -e ".[dev,review,openfisca]" && pytest

      - name: Build
        run: pip install build twine && python -m build && twine check dist/*

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "RuleWeaver $VERSION" --notes-file CHANGELOG.md

      - name: Publish the image
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/ruleweaver"
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$VERSION" -t "$image:latest" .
          docker push "$image:$VERSION"
          docker push "$image:latest"
