name: tests

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The review extra is installed here because the gate is tested here: the audit log,
      # the reviewer application and reviewer identity. OpenFisca is installed because the
      # export is run here, beside the evaluator. Without either, those tests skip, and a
      # suite that skips them is not evidence of anything they cover.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,review,openfisca]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # Includes the mutation harness. The suite passing is not by itself evidence the
      # rules are protected; the mutation score is, so it is a build gate rather than a
      # report nobody reads.
      # OpenFisca 45 requires pytest 8. Use a fresh private temporary root for both
      # this process and its nested runner while that compatibility constraint remains.
      - name: Create private test temporary root
        run: echo "PYTEST_DEBUG_TEMPROOT=$(python -c 'import tempfile; print(tempfile.mkdtemp(prefix="ruleweaver-tests-"))')" >> "$GITHUB_ENV"

      - name: Run tests
        run: pytest -rs --cov=ruleweaver --cov-report=term-missing --cov-fail-under=80

      - name: Validate the golden corpus
        run: ruleweaver validate examples/snap/rules.json --sources examples/snap/sources/manifest.json

      - name: Check the fixture still evaluates
        run: ruleweaver evaluate examples/snap/rules.json examples/snap/scenarios/baseline.json

  # A deployment that only executes approved rules installs neither the model SDKs nor the
  # web stack. This job is that deployment. It exists because for three weeks the
  # execution gate imported FastAPI, and nothing ran the base install to notice.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install without extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # OpenFisca 45 requires pytest 8. Use a fresh private temporary root for both
      # this process and its nested runner while that compatibility constraint remains.
      - name: Create private test temporary root
        run: echo "PYTEST_DEBUG_TEMPROOT=$(python -c 'import tempfile; print(tempfile.mkdtemp(prefix="ruleweaver-tests-"))')" >> "$GITHUB_ENV"

      - name: Run tests
        run: pytest -rs

      - name: Validate the golden corpus
        run: ruleweaver validate examples/snap/rules.json --sources examples/snap/sources/manifest.json

      - name: Check the fixture still evaluates
        run: ruleweaver evaluate examples/snap/rules.json examples/snap/scenarios/baseline.json

  # What a user installs is the wheel, and what a deployment runs is the image. Both are
  # built and exercised here, so a release is never the first time either has been run.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel and sdist
        run: python -m pip install --upgrade pip build twine && python -m build && twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/ruleweaver --version
          /tmp/clean/bin/ruleweaver validate examples/snap/rules.json

      - name: Build the image
        run: docker build -t ruleweaver:ci .

      - name: The image refuses to start without an identity provider
        run: "! docker run --rm ruleweaver:ci"

      - name: The image serves and reports healthy
        run: |
          docker run -d --name rw -p 8000:8000 \
            -e RULEWEAVER_SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            ruleweaver:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs rw
          exit 1
